# Repository-specific context for AGENTS.md.
# Place this file in krkn-operator-ecosystem/krkn-operator/.
# All relative paths are resolved from that repository's root.

[project]
name = "krkn-operator"
type = "go-operator"
description = "Main Krkn Kubernetes/OpenShift operator and REST API; orchestrates the containerized Krkn Python core and uses the shared krknctl Go library."

[ecosystem_projects]
krkn-operator = "."
krkn-operator-console = "../krkn-operator-console"
krkn-operator-acm = "../krkn-operator-acm"
krknctl = "../../krknctl"
krkn = "../../krkn"

[paths]
pkg_public_api = "pkg/"
internal_api = "internal/"

[beads]
project_label = "project:krkn-operator"
# Use the repository's existing .beads symlink to the shared central database.
# Do not initialize a new database or replace the symlink.
central_database = ".beads"
export_path = "beads/"
# Preserve the shared issue prefix already configured in Beads (tsebastiani).
# Follow the repository's actual Git policy for exports; do not change it here.

[commands]
# Intentionally unset for now, not a blocker by itself.
# When validation is needed, discover the current commands in the Makefile,
# project scripts and CI. Commented examples below are not verified targets.
# build = "make build"
# test = "make test"
# lint = "make lint"
# format = "make fmt"

