  /v2/ws/dashboard/active-runs:
    get:
      consumes:
      - application/json
      description: |-
        Multiplexed WebSocket for real-time updates across all resources

        **Authentication:** JWT token via Sec-WebSocket-Protocol subprotocol
        - JavaScript: `new WebSocket(url, 'access_token.' + jwtToken)`
        - Header: `Sec-WebSocket-Protocol: access_token.<jwt_token>`

        **Client → Server Messages (subscribe/unsubscribe):**
        ```json
        {
        "action": "subscribe",
        "resource": "run",
        "ids": ["run-abc123", "run-xyz789"]
        }
        ```

        **Resource types:** `run`, `graphrun`, `dashboard`

        **Server → Client Messages (updates):**
        ```json
        {
        "resource": "run",
        "id": "run-abc123",
        "event": "updated",
        "data": { ... }
        }
        ```

        **Available endpoints:**
        - `/api/v2/ws/runs` - Subscribe to scenario run updates
        - `/api/v2/ws/graphruns` - Subscribe to graph run updates
        - `/api/v2/ws/dashboard/active-runs` - Subscribe to dashboard updates
      produces:
      - application/json
      responses:
        "101":
          description: Switching protocols - WebSocket upgrade successful
          schema:
            $ref: '#/definitions/internal_api_v2_websocket.ServerMessage'
        "401":
          description: Unauthorized - missing or invalid JWT token
          schema:
            $ref: '#/definitions/internal_api_v2_websocket.ErrorMessage'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api_v2_websocket.ErrorMessage'
      security:
      - BearerAuth: []
      summary: WebSocket real-time updates
      tags:
      - websocket
