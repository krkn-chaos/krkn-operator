basePath: /api/v1
definitions:
  github_com_krkn-chaos_krkn-operator_api_v1alpha1.ClusterTarget:
    properties:
      cluster-api-url:
        description: ClusterAPIURL is the API server URL of the managed cluster
        type: string
      cluster-name:
        description: ClusterName is the name of the managed cluster
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_api_v1alpha1.GraphScenarioNode:
    properties:
      _comment:
        description: |-
          Comment is an optional comment describing the scenario
          +optional
        type: string
      depends_on:
        description: |-
          DependsOn is the node ID that this scenario depends on (parent in the graph)
          +optional
        type: string
      env:
        additionalProperties:
          type: string
        description: |-
          Env is a map of environment variables for the scenario
          +optional
        type: object
      image:
        description: |-
          Image is the container image for the scenario
          +optional
        type: string
      name:
        description: |-
          Name is the name of the scenario
          +optional
        type: string
      volumes:
        additionalProperties:
          type: string
        description: |-
          Volumes is a map of volume mounts for the scenario
          +optional
        type: object
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_files.AvailableFilesResponse:
    properties:
      files:
        description: Files is the list of files available to the current user
        items:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_files.FileInfo'
        type: array
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_files.CreateFileRequest:
    properties:
      availableToAll:
        description: AvailableToAll makes the file accessible to all users
        type: boolean
      content:
        description: Content is the file content
        type: string
      description:
        description: Description is an optional description of the file
        type: string
      fileName:
        description: FileName is the key in the ConfigMap data (the actual file name)
        type: string
      filePurpose:
        description: FilePurpose is an optional system-level classification (e.g.,
          "workflow-template")
        type: string
      fileType:
        description: FileType is an optional file type category (e.g., "config", "script")
          - for user categorization
        type: string
      groups:
        description: Groups is a list of group names that can access this file
        items:
          type: string
        type: array
      studioLayout:
        description: StudioLayout is optional frontend visual layout data (stored
          as separate ConfigMap entry)
        type: string
      workflowName:
        description: WorkflowName is the user-defined workflow name (only for workflow
          templates)
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_files.CreateFileResponse:
    properties:
      fileId:
        description: FileID is the generated UUID for this file (used for retrieval)
        type: string
      message:
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_files.FileInfo:
    properties:
      createdAt:
        description: CreatedAt is the timestamp when the file was created (ISO 8601)
        type: string
      description:
        description: Description is an optional description of the file
        type: string
      fileId:
        description: FileID is the UUID identifier for this file
        type: string
      fileName:
        description: FileName is the key in the ConfigMap data (the actual file name)
        type: string
      filePurpose:
        description: FilePurpose is the system-level classification (e.g., "workflow-template")
        type: string
      fileType:
        description: FileType is an optional file type category (e.g., "config", "script")
          - for user categorization
        type: string
      updatedAt:
        description: UpdatedAt is the timestamp when the file was last updated (ISO
          8601)
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_files.FileReference:
    properties:
      fileId:
        description: FileID is the UUID of the file to mount
        type: string
      mountPath:
        description: MountPath is the absolute path where the file should be mounted
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_files.FileResponse:
    properties:
      availableToAll:
        description: AvailableToAll makes the file accessible to all users
        type: boolean
      content:
        description: Content is the file content
        type: string
      createdAt:
        description: CreatedAt is the timestamp when the file was created
        type: string
      createdBy:
        description: CreatedBy is the email of the user who created the file
        type: string
      description:
        description: Description is an optional description of the file
        type: string
      fileId:
        description: FileID is the UUID identifier for this file
        type: string
      fileName:
        description: FileName is the key in the ConfigMap data (the actual file name)
        type: string
      filePurpose:
        description: FilePurpose is the system-level classification (e.g., "workflow-template")
        type: string
      fileType:
        description: FileType is an optional file type category (e.g., "config", "script")
          - for user categorization
        type: string
      groups:
        description: Groups is a list of group names that can access this file
        items:
          type: string
        type: array
      studioLayout:
        description: StudioLayout is optional frontend visual layout data
        type: string
      updatedAt:
        description: UpdatedAt is the timestamp when the file was last updated
        type: string
      updatedBy:
        description: UpdatedBy is the email of the user who last updated the file
        type: string
      workflowName:
        description: WorkflowName is the user-defined workflow name (only for workflow
          templates)
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_files.ListFilesResponse:
    properties:
      files:
        description: Files is the list of file ConfigMaps
        items:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_files.FileResponse'
        type: array
      total:
        description: Total is the total number of files returned
        type: integer
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_workflows.AvailableWorkflowsResponse:
    properties:
      workflows:
        description: Workflows is the list of workflows available to the current user
        items:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_workflows.WorkflowInfo'
        type: array
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_workflows.CreateWorkflowRequest:
    properties:
      availableToAll:
        description: AvailableToAll makes the workflow accessible to all users
        type: boolean
      description:
        description: Description is an optional description of the workflow
        type: string
      fileType:
        description: FileType is an optional user-defined category (e.g., "pod-chaos",
          "network-chaos")
        type: string
      graph:
        additionalProperties:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_api_v1alpha1.GraphScenarioNode'
        description: Graph is the workflow graph definition (map of node ID to GraphScenarioNode)
        type: object
      groups:
        description: Groups is a list of group names that can access this workflow
          (max 1)
        items:
          type: string
        type: array
      studioLayout:
        additionalProperties: true
        description: |-
          StudioLayout is frontend-owned visual canvas data (opaque to backend - just store and return it)
          Contains node positions, edges, nextNodeNumber, etc.
        type: object
      workflowName:
        description: WorkflowName is a human-readable name for the workflow
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_workflows.CreateWorkflowResponse:
    properties:
      message:
        description: Message is a human-readable status message
        type: string
      workflowId:
        description: WorkflowID is the generated UUID for this workflow
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_workflows.ListWorkflowsResponse:
    properties:
      total:
        description: Total is the total number of workflows returned
        type: integer
      workflows:
        description: Workflows is the list of workflow templates
        items:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_workflows.WorkflowResponse'
        type: array
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_workflows.WorkflowInfo:
    properties:
      description:
        description: Description is an optional description of the workflow
        type: string
      fileType:
        description: FileType is the user-defined category
        type: string
      nodeCount:
        description: NodeCount is the number of nodes in the workflow graph
        type: integer
      workflowId:
        description: WorkflowID is the UUID identifier for this workflow
        type: string
      workflowName:
        description: WorkflowName is a human-readable name for the workflow
        type: string
    type: object
  github_com_krkn-chaos_krkn-operator_pkg_workflows.WorkflowResponse:
    properties:
      availableToAll:
        description: AvailableToAll indicates if the workflow is accessible to all
          users
        type: boolean
      createdAt:
        description: CreatedAt is the timestamp when the workflow was created
        type: string
      createdBy:
        description: CreatedBy is the email of the user who created the workflow
        type: string
      description:
        description: Description is an optional description of the workflow
        type: string
      fileType:
        description: FileType is the user-defined category
        type: string
      graph:
        additionalProperties:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_api_v1alpha1.GraphScenarioNode'
        description: Graph is the workflow graph definition
        type: object
      groups:
        description: Groups is a list of group names that can access this workflow
        items:
          type: string
        type: array
      studioLayout:
        additionalProperties: true
        description: |-
          StudioLayout is frontend-owned visual canvas data (opaque to backend - just store and return it)
          Contains node positions, edges, nextNodeNumber, etc.
        type: object
      updatedAt:
        description: UpdatedAt is the timestamp when the workflow was last updated
        type: string
      updatedBy:
        description: UpdatedBy is the email of the user who last updated the workflow
        type: string
      workflowId:
        description: WorkflowID is the UUID identifier for this workflow
        type: string
      workflowName:
        description: WorkflowName is a human-readable name for the workflow
        type: string
    type: object
  internal_api.ClustersResponse:
    properties:
      status:
        description: Status represents the current state of the request (pending,
          completed)
        type: string
      targetData:
        additionalProperties:
          items:
            $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_api_v1alpha1.ClusterTarget'
          type: array
        description: TargetData contains a map of operator-name to list of cluster
          targets
        type: object
    type: object
  internal_api.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  internal_api.FileMount:
    properties:
      content:
        description: Content is the base64-encoded file content
        type: string
      mountPath:
        description: MountPath is the absolute path where the file should be mounted
        type: string
      name:
        description: Name is the file name
        type: string
    type: object
  internal_api.GraphRunCreateRequest:
    properties:
      graph:
        additionalProperties:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_api_v1alpha1.GraphScenarioNode'
        description: Graph is the dependency graph of scenarios to execute
        type: object
      targetClusters:
        additionalProperties:
          items:
            type: string
          type: array
        description: TargetClusters is a map of provider-name to list of cluster names
        type: object
      targetRequestId:
        description: TargetRequestID is the reference to the KrknTargetRequest CR
        type: string
    type: object
  internal_api.GraphRunDetailResponse:
    properties:
      creationTimestamp:
        type: string
      name:
        type: string
      namespace:
        type: string
      spec:
        $ref: '#/definitions/internal_api.GraphRunSpecResponse'
      status:
        $ref: '#/definitions/internal_api.GraphRunStatusResponse'
    type: object
  internal_api.GraphRunSpecResponse:
    properties:
      graph:
        additionalProperties:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_api_v1alpha1.GraphScenarioNode'
        type: object
      ownerUserId:
        type: string
      resiliencyMountPath:
        type: string
      resiliencyScoreBaseline:
        type: number
      resiliencyScoreEnabled:
        type: boolean
      targetClusters:
        additionalProperties:
          items:
            type: string
          type: array
        type: object
      targetRequestId:
        type: string
    type: object
  internal_api.GraphRunStatusResponse:
    properties:
      completionTime:
        type: string
      nodeStatuses:
        items:
          $ref: '#/definitions/internal_api.NodeStatusResponse'
        type: array
      phase:
        type: string
      resiliencyScore:
        $ref: '#/definitions/internal_api.ResiliencyScoreResponse'
      resolvedLevels:
        items:
          items:
            type: string
          type: array
        type: array
      startTime:
        type: string
      summary:
        $ref: '#/definitions/internal_api.GraphRunSummaryResponse'
    type: object
  internal_api.GraphRunSummaryResponse:
    properties:
      completedNodes:
        type: integer
      failedNodes:
        type: integer
      pendingNodes:
        type: integer
      runningNodes:
        type: integer
      totalNodes:
        type: integer
    type: object
  internal_api.IsRegisteredResponse:
    properties:
      registered:
        description: Registered indicates if at least one admin user exists
        type: boolean
    type: object
  internal_api.LoginRequest:
    properties:
      password:
        description: Password is the plaintext password (required)
        type: string
      userId:
        description: UserID is the email address of the user (required)
        type: string
    type: object
  internal_api.LoginResponse:
    properties:
      expiresAt:
        description: ExpiresAt is the token expiration timestamp
        type: string
      name:
        description: Name is the user's first name
        type: string
      role:
        description: Role is the user's role
        type: string
      surname:
        description: Surname is the user's last name
        type: string
      token:
        description: Token is the JWT authentication token
        type: string
      userId:
        description: UserID is the authenticated user's email
        type: string
    type: object
  internal_api.NodeStatusResponse:
    properties:
      completionTime:
        type: string
      dependsOn:
        items:
          type: string
        type: array
      message:
        type: string
      nodeId:
        type: string
      nodeName:
        type: string
      phase:
        type: string
      scenarioRunRef:
        type: string
      startTime:
        type: string
    type: object
  internal_api.RegisterRequest:
    properties:
      name:
        description: Name is the first name of the user (required)
        type: string
      organization:
        description: Organization is the user's organization (optional)
        type: string
      password:
        description: Password is the plaintext password (required, min 8 characters)
        type: string
      role:
        description: Role is either "user" or "admin" (required)
        type: string
      surname:
        description: Surname is the last name of the user (required)
        type: string
      userId:
        description: UserID is the email address of the user (required)
        type: string
    type: object
  internal_api.RegisterResponse:
    properties:
      message:
        description: Message contains a success message
        type: string
      role:
        description: Role is the user's role
        type: string
      userId:
        description: UserID is the registered user's email
        type: string
    type: object
  internal_api.ResiliencyScoreResponse:
    properties:
      baseline:
        type: number
      calculated:
        type: number
      message:
        type: string
      status:
        type: string
    type: object
  internal_api.ScenarioRunRequest:
    properties:
      environment:
        additionalProperties:
          type: string
        description: Environment is a map of environment variables to pass to the
          container (optional)
        type: object
      fileReferences:
        description: FileReferences are references to centrally-managed files by UUID
          (optional)
        items:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_files.FileReference'
        type: array
      files:
        description: Files is an array of file objects to mount in the container (optional,
          legacy inline file mount)
        items:
          $ref: '#/definitions/internal_api.FileMount'
        type: array
      kubeconfigPath:
        description: 'KubeconfigPath is the path where kubeconfig should be mounted
          (optional, default: /home/krkn/.kube/config)'
        type: string
      registryName:
        description: |-
          RegistryName is the name of a saved registry (optional)
          If omitted, defaults to quay.io public registry
        type: string
      scenarioImage:
        description: ScenarioImage is the container image to run
        type: string
      scenarioName:
        description: ScenarioName is the name of the scenario being executed
        type: string
      targetClusters:
        additionalProperties:
          items:
            type: string
          type: array
        description: |-
          TargetClusters is a map of provider-name to list of cluster names
          Example: {"krkn-operator": ["cluster1", "cluster2"], "krkn-operator-acm": ["cluster3"]}
        type: object
      targetRequestId:
        description: TargetRequestID is the UUID of the KrknTargetRequest (required)
        type: string
    type: object
  internal_api_v2_websocket.ErrorMessage:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  internal_api_v2_websocket.ServerMessage:
    properties:
      data: {}
      event:
        description: '"updated", "deleted", "snapshot"'
        type: string
      id:
        description: resource ID (empty for dashboard)
        type: string
      resource:
        description: '"run", "graphrun", "dashboard"'
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: krkn-chaos@googlegroups.com
    name: Krkn Team
    url: https://github.com/krkn-chaos/krkn-operator
  description: |-
    REST and WebSocket API for Krkn chaos engineering operator.

    **API Versions:**
    - **v1** - REST API with polling (deprecated but maintained)
    - **v2** - REST API (same as v1) + WebSocket real-time updates

    **WebSocket Authentication (v2):**
    WebSocket endpoints use JWT via subprotocol header:
    - JavaScript: `new WebSocket(url, 'access_token.' + jwtToken)`
    - Header: `Sec-WebSocket-Protocol: access_token.<jwt_token>`

    **Migration Path:**
    1. v1 REST → v2 REST (no changes, just update base path)
    2. v2 REST → v2 WebSocket (replace polling with multiplexed WebSocket)
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://krkn-chaos.dev/terms
  title: Krkn Operator API
  version: "2.0"
paths:
  /auth/is-registered:
    get:
      description: Check if at least one admin user exists in the system. Used to
        determine if initial registration is needed.
      produces:
      - application/json
      responses:
        "200":
          description: Registration status
          schema:
            $ref: '#/definitions/internal_api.IsRegisteredResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Check if admin user is registered
      tags:
      - authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with userID and password. Returns JWT token for
        API access.
      parameters:
      - description: User credentials
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/internal_api.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: JWT token and user info
          schema:
            $ref: '#/definitions/internal_api.LoginResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: User login
      tags:
      - authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Register the first admin user in the system. This endpoint is only
        available when no admin exists. After registration, use POST /api/v1/users
        to create additional users.
      parameters:
      - description: User registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_api.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created and JWT token issued
          schema:
            $ref: '#/definitions/internal_api.RegisterResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Admin already registered
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      summary: Register first admin user
      tags:
      - authentication
  /clusters:
    get:
      description: Get the list of target clusters from a KrknTargetRequest by ID
      parameters:
      - description: KrknTargetRequest ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of clusters by provider
          schema:
            $ref: '#/definitions/internal_api.ClustersResponse'
        "400":
          description: Missing or invalid ID parameter
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "404":
          description: Target request not found
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List available clusters
      tags:
      - clusters
  /files:
    get:
      description: Get list of all file ConfigMaps (admin only). Supports filtering
        by filePurpose query parameter.
      parameters:
      - description: Filter by file purpose (e.g., workflow-template)
        in: query
        name: filePurpose
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of files
          schema:
            $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_files.ListFilesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "403":
          description: Forbidden (admin only)
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List files (admin only)
      tags:
      - files
    post:
      consumes:
      - application/json
      description: Create a new file ConfigMap. Users can create files for their own
        groups or public files. Admins can create files for any group. Cannot create
        workflow-template files (use POST /api/v1/workflows instead).
      parameters:
      - description: File data
        in: body
        name: file
        required: true
        schema:
          $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_files.CreateFileRequest'
      produces:
      - application/json
      responses:
        "201":
          description: File created
          schema:
            $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_files.CreateFileResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create file
      tags:
      - files
  /files/available:
    get:
      description: Get files accessible to current user (own files, group files, public
        files). Supports filtering by filePurpose query parameter.
      parameters:
      - description: Filter by file purpose (e.g., workflow-template)
        in: query
        name: filePurpose
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of accessible files
          schema:
            $ref: '#/definitions/github_com_krkn-chaos_krkn-operator_pkg_files.AvailableFilesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List available files
      tags:
      - files
  /graphruns:
    get:
      description: Get list of all graph runs. Regular users see only their own, admins
        see all.
      produces:
      - application/json
      responses:
        "200":
          description: List of graph runs
          schema:
            items:
              type: object
            type: array
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/internal_api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List graph runs
      tags:
      - graphruns
    post:
      consumes:
