apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: krkn-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: krkn-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: krkn-operator
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
          - --api-port=8080
          - --grpc-server-address=localhost:50051
        image: controller:latest
        imagePullPolicy: Always
        name: manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Trusted reverse-proxy / load-balancer networks (comma-separated CIDRs).
        # The auth endpoints are rate-limited per client IP. When the operator
        # runs behind an ingress or load balancer, uncomment and set this so the
        # real client IP is read from X-Forwarded-For / X-Real-IP — but only for
        # requests arriving from these networks. Leave unset for direct access:
        # forwarding headers are then ignored so clients cannot spoof the key.
        # - name: TRUSTED_PROXY_CIDRS
        #   value: "10.0.0.0/8,192.168.0.0/16"
        # Optional WebSocket Origin enforcement (comma-separated allowed origins).
        # OFF by default: all origins are accepted because WebSocket auth uses a
        # JWT subprotocol (not cookies), so CSWSH does not apply. Uncomment to
        # opt in to same-origin + allow-list enforcement as defense-in-depth.
        # - name: WEBSOCKET_ALLOWED_ORIGINS
        #   value: "https://console.example.com,http://localhost:3000"
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      - name: data-provider
        image: krkn-chaos.docker.scarf.sh/krkn-chaos/krkn-operator-data-provider:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
