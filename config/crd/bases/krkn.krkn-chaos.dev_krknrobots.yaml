---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  labels:
    app.kubernetes.io/name: krkn-operator
  name: krknrobots.krkn.krkn-chaos.dev
spec:
  group: krkn.krkn-chaos.dev
  names:
    kind: KrknRobot
    listKind: KrknRobotList
    plural: krknrobots
    shortNames:
    - kr
    singular: krknrobot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.disabled
      name: Disabled
      type: boolean
    - jsonPath: .status.tokenExpiresAt
      name: TokenExpires
      type: date
    - jsonPath: .status.lastUsedAt
      name: LastUsed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          KrknRobot is the Schema for the krknrobots API.
          It represents a machine identity for the krkn-operator MCP endpoint.

          The KrknRobot CRD must be labeled with:
            - krkn.krkn-chaos.dev/robot-account: "true"
            - group.krkn.krkn-chaos.dev/<group>: "true" for each group the robot
              belongs to (see groupauth.GroupLabelPrefix)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KrknRobotSpec defines the desired state of KrknRobot.
              A KrknRobot is a machine identity used by AI agents to access the MCP
              endpoint. Group membership is expressed via group labels on the resource.
            properties:
              description:
                description: Description is a human-readable description of the robot's
                  purpose
                maxLength: 256
                type: string
              disabled:
                description: 'Disabled disables the robot: token verification fails
                  immediately'
                type: boolean
            type: object
          status:
            description: KrknRobotStatus defines the observed state of KrknRobot.
            properties:
              lastUsedAt:
                description: LastUsedAt is the timestamp of the robot's last authenticated
                  request
                format: date-time
                type: string
              tokenExpiresAt:
                description: TokenExpiresAt is the timestamp when the active token
                  expires
                format: date-time
                type: string
              tokenId:
                description: TokenID identifies the currently active token
                type: string
              tokenIssuedAt:
                description: TokenIssuedAt is the timestamp when the active token
                  was issued
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
