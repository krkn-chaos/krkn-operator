# Values used to render the OpenShift OLM bundle.
# The bundle intentionally contains no external exposure resource.
acm:
  enabled: false

operator:
  olmBootstrap: true
  olmOpenShift: true

rbac:
  scenarioRunner:
    create: false

console:
  enabled: true
  ingress:
    enabled: false
  gateway:
    enabled: false
  route:
    enabled: false
