{{- if and .Values.console.enabled .Values.console.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "krkn-operator.console.fullname" . }}
  namespace: {{ include "krkn-operator.namespace" . }}
  labels:
    {{- include "krkn-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
  {{- with .Values.console.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.console.ingress.className }}
  ingressClassName: {{ .Values.console.ingress.className }}
  {{- end }}
  {{- if .Values.console.ingress.tls.enabled }}
  tls:
    - hosts:
      {{- if .Values.console.ingress.hostname }}
      - {{ .Values.console.ingress.hostname | quote }}
      {{- end }}
      secretName: {{ .Values.console.ingress.tls.secretName | default (printf "%s-tls" (include "krkn-operator.console.fullname" .)) }}
  {{- end }}
  rules:
    - {{- if .Values.console.ingress.hostname }}
      host: {{ .Values.console.ingress.hostname | quote }}
      {{- end }}
      http:
        paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: {{ include "krkn-operator.console.fullname" . }}
              port:
                number: {{ .Values.console.service.port }}
{{- end }}
