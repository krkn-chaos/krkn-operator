{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "krkn-operator.operator.fullname" . }}
  namespace: {{ include "krkn-operator.namespace" . }}
  labels:
    {{- include "krkn-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
    control-plane: controller-manager
spec:
  replicas: {{ .Values.operator.replicaCount }}
  selector:
    matchLabels:
      {{- include "krkn-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
      control-plane: controller-manager
  template:
    metadata:
      labels:
        {{- include "krkn-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
        control-plane: controller-manager
    spec:
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "krkn-operator.serviceAccountName" . }}
      {{- if .Values.operator.olmBootstrap }}
      initContainers:
      - name: olm-bootstrap-resources
        image: {{ .Values.images.operator.image }}
        imagePullPolicy: {{ .Values.images.operator.pullPolicy }}
        command:
        - /manager
        args:
        - --bootstrap-resources
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: KRKN_OLM_OPENSHIFT
          value: {{ .Values.operator.olmOpenShift | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      {{- end }}
      securityContext:
        {{- toYaml .Values.operator.securityContext | nindent 8 }}
      containers:
      # Main operator container
      - name: manager
        image: {{ .Values.images.operator.image }}
        imagePullPolicy: {{ .Values.images.operator.pullPolicy }}
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --metrics-secure=true
        - --api-port={{ .Values.operator.service.port }}
        - --grpc-server-address=localhost:{{ .Values.operator.service.grpcPort }}
        {{- if not .Values.operator.olmBootstrap }}
        - --enable-krkn-ai={{ .Values.krknAI.enabled }}
        {{- end }}
        ports:
        - containerPort: {{ .Values.operator.service.port }}
          name: http
          protocol: TCP
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- if .Values.operator.olmBootstrap }}
        - name: KRKN_OLM_ENABLED
          value: "true"
        - name: KRKN_OLM_OPENSHIFT
          value: {{ .Values.operator.olmOpenShift | quote }}
        - name: KRKNAI_ENABLED
          value: "false"
        - name: KRKNAI_ORCHESTRATOR_IMAGE
          value: {{ .Values.images.aiOrchestrator.image | quote }}
        - name: KRKNAI_ORCHESTRATOR_IMAGE_PULL_POLICY
          value: {{ .Values.images.aiOrchestrator.pullPolicy | quote }}
        - name: KRKNAI_SERVICE_IMAGE
          value: {{ .Values.images.aiService.image | quote }}
        - name: KRKNAI_SERVICE_IMAGE_PULL_POLICY
          value: {{ .Values.images.aiService.pullPolicy | quote }}
        - name: KRKNAI_IMAGE_PULL_SECRETS
          value: {{ .Values.images.pullSecrets | toJson | quote }}
        - name: KRKNAI_STORAGE_EXISTING_CLAIM
          value: {{ .Values.aiService.storage.existingClaim | quote }}
        - name: KRKNAI_STORAGE_CLASS_NAME
          value: {{ .Values.aiService.storage.storageClassName | quote }}
        - name: KRKNAI_STORAGE_SIZE
          value: {{ .Values.aiService.storage.size | quote }}
        - name: KRKNAI_SERVICE_RESOURCES
          value: {{ .Values.aiService.resources | toJson | quote }}
        - name: KRKNAI_NETWORK_POLICY_ENABLED
          value: {{ .Values.aiService.networkPolicy.enabled | quote }}
        {{- else if .Values.krknAI.enabled }}
        - name: KRKNAI_ORCHESTRATOR_IMAGE
          value: {{ .Values.images.aiOrchestrator.image | quote }}
        - name: KRKNAI_ORCHESTRATOR_IMAGE_PULL_POLICY
          value: {{ .Values.images.aiOrchestrator.pullPolicy | quote }}
        - name: KRKNAI_SERVICE_IMAGE
          value: {{ .Values.images.aiService.image | quote }}
        - name: KRKNAI_SERVICE_IMAGE_PULL_POLICY
          value: {{ .Values.images.aiService.pullPolicy | quote }}
        - name: KRKNAI_SERVICE_URL
          value: {{ printf "http://%s-ai-service:8080" (include "krkn-operator.fullname" .) | quote }}
        - name: KRKNAI_SERVICE_TOKEN_SECRET_NAME
          value: {{ printf "%s-ai-service-token" (include "krkn-operator.fullname" .) | quote }}
        - name: KRKNAI_ORCHESTRATOR_SERVICE_ACCOUNT_NAME
          value: {{ printf "%s-krkn-ai-orchestrator" (include "krkn-operator.fullname" .) | quote }}
        - name: KRKNAI_IMAGE_PULL_SECRETS
          value: {{ .Values.images.pullSecrets | toJson | quote }}
        - name: KRKNAI_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ printf "%s-ai-service-token" (include "krkn-operator.fullname" .) | quote }}
              key: token
        {{- end }}
        {{- if or .Values.operator.olmBootstrap .Values.krknAI.enabled }}
        - name: KRKNAI_ORCHESTRATOR_RESOURCES
          value: {{ .Values.krknAI.orchestrator.resources | toJson | quote }}
        - name: KRKNAI_RESULT_UPLOADER_RESOURCES
          value: {{ .Values.krknAI.resultUploader.resources | toJson | quote }}
        - name: KRKNAI_OUTPUT_SIZE_LIMIT
          value: {{ .Values.krknAI.volumes.output.sizeLimit | quote }}
        - name: KRKNAI_TMP_SIZE_LIMIT
          value: {{ .Values.krknAI.volumes.tmp.sizeLimit | quote }}
        - name: KRKNAI_UPLOAD_STATE_SIZE_LIMIT
          value: {{ .Values.krknAI.volumes.uploadState.sizeLimit | quote }}
        {{- end }}
        - name: KRKN_ROLLBACK_INSPECTOR_IMAGE
          value: {{ .Values.images.operator.image | quote }}
        - name: KRKN_ROLLBACK_INSPECTOR_PULL_SECRETS
          value: {{ toJson .Values.images.pullSecrets | quote }}
        - name: JWT_EXPIRY_HOURS
          value: {{ .Values.auth.jwtExpiryHours | quote }}
        {{- with .Values.auth.trustedProxyCIDRs }}
        - name: TRUSTED_PROXY_CIDRS
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.auth.websocketAllowedOrigins }}
        - name: WEBSOCKET_ALLOWED_ORIGINS
          value: {{ . | quote }}
        {{- end }}
        {{- with .Values.operator.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        resources:
          {{- toYaml .Values.operator.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      # Data provider sidecar
      - name: data-provider
        image: {{ .Values.images.dataProvider.image }}
        imagePullPolicy: {{ .Values.images.dataProvider.pullPolicy }}
        ports:
        - containerPort: {{ .Values.operator.service.grpcPort }}
          name: grpc
          protocol: TCP
        resources:
          {{- toYaml .Values.operator.dataProvider.resources | nindent 10 }}
        livenessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: grpc
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
