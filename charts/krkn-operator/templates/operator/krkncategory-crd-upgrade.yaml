{{- if .Release.IsUpgrade -}}
  {{- $crdName := "krkncategories.krkn.krkn-chaos.dev" -}}
  {{- $existing := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $crdName -}}
  {{- $releaseName := "" -}}
  {{- $releaseNamespace := "" -}}
  {{- if $existing -}}
    {{- $annotations := get $existing.metadata "annotations" | default dict -}}
    {{- $releaseName = get $annotations "meta.helm.sh/release-name" -}}
    {{- $releaseNamespace = get $annotations "meta.helm.sh/release-namespace" -}}
  {{- end -}}
  {{- if or (not $existing) (and (eq $releaseName .Release.Name) (eq $releaseNamespace .Release.Namespace)) -}}
    {{- $crd := .Files.Get "files/krkncategories.yaml" | fromYaml -}}
    {{- $annotations := get $crd.metadata "annotations" | default dict -}}
    {{- $_ := set $annotations "helm.sh/resource-policy" "keep" -}}
    {{- $_ := set $crd.metadata "annotations" $annotations -}}
{{ toYaml $crd }}
  {{- end -}}
{{- end -}}
