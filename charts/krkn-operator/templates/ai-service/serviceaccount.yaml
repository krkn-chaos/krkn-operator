{{- if and .Values.krknAI.enabled (not .Values.operator.olmBootstrap) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "krkn-operator.fullname" . }}-ai-service
  namespace: {{ include "krkn-operator.namespace" . }}
  labels:
    {{- include "krkn-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
{{- end }}
