{{- $secretName := printf "%s-ai-service-token" (include "krkn-operator.fullname" .) }}
{{- $existing := lookup "v1" "Secret" (include "krkn-operator.namespace" .) $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "krkn-operator.namespace" . }}
  labels:
    {{- include "krkn-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: ai-service
type: Opaque
data:
  token: {{ if $existing }}{{ index $existing.data "token" }}{{ else }}{{ default (randAlphaNum 48) .Values.aiService.serviceToken | b64enc }}{{ end }}
