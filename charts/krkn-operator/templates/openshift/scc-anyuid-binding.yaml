{{- if .Capabilities.APIVersions.Has "security.openshift.io/v1/SecurityContextConstraints" }}
{{- $scc := .Values.scenarioRunner.scc | default "privileged" }}
{{- if not (has $scc (list "anyuid" "privileged")) }}
{{- fail (printf "scenarioRunner.scc must be 'anyuid' or 'privileged', got: '%s'" $scc) }}
{{- end }}
---
# Grants OpenShift SCC to scenario-runner ServiceAccount.
# Configurable via .Values.scenarioRunner.scc (default: privileged).
# Node-level scenarios (node-network, node-cpu-hog, etc.) require "privileged".
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "krkn-operator.fullname" . }}-scenario-runner-scc
  labels:
    {{- include "krkn-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "system:openshift:scc:%s" $scc }}
subjects:
- kind: ServiceAccount
  name: {{ include "krkn-operator.fullname" . }}-krkn-scenario-runner
  namespace: {{ include "krkn-operator.namespace" . }}
{{- end }}
