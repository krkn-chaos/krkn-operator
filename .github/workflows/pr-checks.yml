name: PR Checks

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-and-quality:
    name: Security & Code Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify generated manifests are up to date
        run: |
          make manifests
          # intent-to-add, so a brand new CRD file is caught too, git diff ignores untracked files
          git add -AN config/crd/bases charts/krkn-operator/crds
          git diff --exit-code config/crd/bases charts/krkn-operator/crds

      - name: Run gosec security scanner
        uses: securego/gosec@master
        with:
          args: --exclude G402 --exclude G103 --exclude-dir=proto ./...

      - name: Run staticcheck static analyzer
        run: |
          wget -q https://github.com/dominikh/go-tools/releases/latest/download/staticcheck_linux_amd64.tar.gz
          tar xfz staticcheck_linux_amd64.tar.gz
          ./staticcheck/staticcheck -checks all $(go list ./... | grep -v '/proto/')

      - name: Set up envtest binaries
        run: make setup-envtest

      - name: Run tests
        run: |
          go mod tidy
          make test
