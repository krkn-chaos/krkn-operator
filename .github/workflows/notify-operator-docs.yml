name: Notify Operator documentation website

on:
  workflow_call:
    inputs:
      operator_tag:
        description: Published Operator tag
        required: true
        type: string
    secrets:
      DOC_SYNC_BOT_APP_PRIVATE_KEY:
        required: true
  workflow_dispatch:
    inputs:
      operator_tag:
        description: Published Operator tag to retry
        required: true
        type: string
  workflow_run:
    workflows: ["Release Helm Chart", "Release"]
    types: [completed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    # The receiver verifies the published release and chart independently.
    if: >-
      github.repository == 'krkn-chaos/krkn-operator' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == 'krkn-chaos/krkn-operator' &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.name == 'Release')))
    runs-on: ubuntu-latest
    steps:
      - name: Mint website dispatch token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DOC_SYNC_BOT_APP_ID }}
          private-key: ${{ secrets.DOC_SYNC_BOT_APP_PRIVATE_KEY }}
          owner: krkn-chaos
          repositories: website
          permission-contents: write

      - name: Check out Operator release workflow
        uses: actions/checkout@v5
        with:
          repository: krkn-chaos/krkn-operator
          ref: main

      - name: Dispatch published tag to website
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_OPERATOR_TAG: ${{ inputs.operator_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUSHED_TAG: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: bash scripts/notify-operator-docs.sh
