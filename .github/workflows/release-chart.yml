name: Release Helm Chart

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  REGISTRY: quay.io
  CHART_REPO: krkn-chaos/charts
  IMAGE_REGISTRY: krkn-chaos.docker.scarf.sh/krkn-chaos

jobs:
  release-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to Quay.io
        run: |
          echo "${{ secrets.QUAY_PASSWORD }}" | helm registry login ${{ env.REGISTRY }} --username ${{ secrets.QUAY_USERNAME }} --password-stdin

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Fetch latest component versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Extract operator version from tag
          OPERATOR_VERSION=${GITHUB_REF#refs/tags/}
          echo "operator=${OPERATOR_VERSION}" >> $GITHUB_OUTPUT

          chmod +x hack/olm/select-compatible-release.sh
          ACM_VERSION=$(hack/olm/select-compatible-release.sh \
            krkn-chaos/krkn-operator-acm "$OPERATOR_VERSION")
          echo "acm=${ACM_VERSION}" >> $GITHUB_OUTPUT
          echo "Compatible ACM version: ${ACM_VERSION}"

          CONSOLE_VERSION=$(hack/olm/select-compatible-release.sh \
            krkn-chaos/krkn-operator-console "$OPERATOR_VERSION")
          echo "console=${CONSOLE_VERSION}" >> $GITHUB_OUTPUT
          echo "Compatible console version: ${CONSOLE_VERSION}"

          AI_SELECTION=$(bash hack/olm/select-ai-release.sh)
          AI_RELEASE=$(jq -er '.release' <<< "$AI_SELECTION")
          echo "ai=${AI_RELEASE#v}" >> "$GITHUB_OUTPUT"
          echo "ai_orchestrator_image=$(jq -er '.orchestratorImage' <<< "$AI_SELECTION")" >> "$GITHUB_OUTPUT"
          echo "ai_service_image=$(jq -er '.serviceImage' <<< "$AI_SELECTION")" >> "$GITHUB_OUTPUT"
          echo "Selected compatible Krkn-AI release: ${AI_RELEASE}"

      - name: Update Chart metadata and images
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          OPERATOR_VERSION=${{ steps.versions.outputs.operator }}
          ACM_VERSION=${{ steps.versions.outputs.acm }}
          CONSOLE_VERSION=${{ steps.versions.outputs.console }}
          AI_VERSION=${{ steps.versions.outputs.ai }}
          export AI_ORCHESTRATOR_IMAGE="${{ steps.versions.outputs.ai_orchestrator_image }}"
          export AI_SERVICE_IMAGE="${{ steps.versions.outputs.ai_service_image }}"
          IMAGE_REGISTRY="${{ env.IMAGE_REGISTRY }}"

          OPERATOR_IMAGE="${IMAGE_REGISTRY}/krkn-operator:${OPERATOR_VERSION}"
          # The image release workflow starts from the same tag. Wait until its
          # multi-architecture manifest is published before packaging the chart.
          for attempt in $(seq 1 60); do
            OPERATOR_MANIFEST=$(docker buildx imagetools inspect "$OPERATOR_IMAGE" 2>/dev/null || true)
            OPERATOR_DIGEST=$(awk '$1 == "Digest:" { print $2; exit }' <<< "$OPERATOR_MANIFEST")
            if [[ "$OPERATOR_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              break
            fi
            sleep 10
          done
          [[ "$OPERATOR_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]

          # Update chart version and appVersion
          yq eval -i ".version = \"${VERSION}\"" charts/krkn-operator/Chart.yaml
          yq eval -i ".appVersion = \"${OPERATOR_VERSION}\"" charts/krkn-operator/Chart.yaml

          # Update image references in values.yaml
          yq eval -i ".images.operator.image = \"${OPERATOR_IMAGE}@${OPERATOR_DIGEST}\"" charts/krkn-operator/values.yaml
          yq eval -i ".images.operator.pullPolicy = \"IfNotPresent\"" charts/krkn-operator/values.yaml

          yq eval -i ".images.dataProvider.image = \"${IMAGE_REGISTRY}/krkn-operator-data-provider:${OPERATOR_VERSION}\"" charts/krkn-operator/values.yaml
          yq eval -i ".images.dataProvider.pullPolicy = \"IfNotPresent\"" charts/krkn-operator/values.yaml

          yq eval -i ".images.acm.image = \"${IMAGE_REGISTRY}/krkn-operator-acm:${ACM_VERSION}\"" charts/krkn-operator/values.yaml
          yq eval -i ".images.acm.pullPolicy = \"IfNotPresent\"" charts/krkn-operator/values.yaml

          yq eval -i ".images.console.image = \"${IMAGE_REGISTRY}/krkn-operator-console:${CONSOLE_VERSION}\"" charts/krkn-operator/values.yaml
          yq eval -i ".images.console.pullPolicy = \"IfNotPresent\"" charts/krkn-operator/values.yaml

          yq eval -i '.images.aiOrchestrator.image = strenv(AI_ORCHESTRATOR_IMAGE)' charts/krkn-operator/values.yaml
          yq eval -i ".images.aiOrchestrator.pullPolicy = \"IfNotPresent\"" charts/krkn-operator/values.yaml
          yq eval -i '.images.aiService.image = strenv(AI_SERVICE_IMAGE)' charts/krkn-operator/values.yaml
          yq eval -i ".images.aiService.pullPolicy = \"IfNotPresent\"" charts/krkn-operator/values.yaml

          echo "Chart version: ${VERSION}"
          echo "Operator version: ${OPERATOR_VERSION}"
          echo "ACM version: ${ACM_VERSION}"
          echo "Console version: ${CONSOLE_VERSION}"
          echo "Krkn-AI version: ${AI_VERSION}"

      - name: Sync generated CRDs into the chart
        run: |
          while IFS= read -r crd_file; do
            [[ "$(basename "$crd_file")" == "krkn.krkn-chaos.dev_krknairuns.yaml" ]] && continue
            cp "$crd_file" charts/krkn-operator/crds/
          done < <(find config/crd/bases -maxdepth 1 -type f -name '*.yaml' -print)
          cp config/crd/bases/krkn.krkn-chaos.dev_krknairuns.yaml \
            charts/krkn-operator/files/krknairun-crd.yaml

      - name: Package and Push Helm Chart
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}

          # Package chart with updated values
          helm package charts/krkn-operator

          # Push to Quay.io OCI registry
          helm push krkn-operator-${VERSION}.tgz oci://${{ env.REGISTRY }}/${{ env.CHART_REPO }}

  notify-website:
    name: Notify Website
    needs: release-chart
    if: ${{ needs.release-chart.result == 'success' }}
    uses: ./.github/workflows/notify-operator-docs.yml
    with:
      operator_tag: ${{ github.ref_name }}
    secrets:
      DOC_SYNC_BOT_APP_PRIVATE_KEY: ${{ secrets.DOC_SYNC_BOT_APP_PRIVATE_KEY }}
