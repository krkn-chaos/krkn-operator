name: OLM Bundles

on:
  pull_request:
    paths:
    - 'charts/krkn-operator/**'
    - 'config/olm/**'
    - 'hack/olm/**'
    - '.github/workflows/olm-bundles.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version to generate
        required: true
        default: 0.1.0

jobs:
  render-and-validate:
    name: Render and validate ${{ matrix.profile }} bundle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [ocp, kubernetes]
    env:
      VERSION: ${{ github.event.inputs.version || '0.1.0' }}
      MIN_KUBE_VERSION: 1.36.0
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Set up Operator SDK
      uses: operator-framework/setup-operator-sdk@v1
      with:
        operator-sdk-version: v1.41.1

    - name: Install yq
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Render and validate bundle
      run: |
        chmod +x hack/olm/render-bundle.sh
        hack/olm/render-bundle.sh "${{ matrix.profile }}" "$VERSION" "dist/bundle-${{ matrix.profile }}"

    - name: Build bundle image locally
      run: |
        docker build \
          --file "dist/bundle-${{ matrix.profile }}/bundle.Dockerfile" \
          --tag "krkn-operator-bundle:${{ matrix.profile }}-${VERSION}" \
          "dist/bundle-${{ matrix.profile }}"

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: krkn-operator-bundle-${{ matrix.profile }}
        path: dist/bundle-${{ matrix.profile }}
