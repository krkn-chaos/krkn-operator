name: OLM Bundles

on:
  pull_request:
    paths:
    - 'charts/krkn-operator/**'
    - 'config/crd/bases/**'
    - 'config/olm/**'
    - 'hack/olm/**'
    - '.github/workflows/olm-bundles.yml'
    - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version to generate
        required: true
        default: 0.1.0

jobs:
  render-and-validate:
    name: Render and validate ${{ matrix.profile }} bundle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [ocp, kubernetes]
    env:
      VERSION: ${{ github.event.inputs.version || '0.1.0' }}
      MIN_KUBE_VERSION: 1.19.0
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Install Operator SDK
      run: |
        version=v1.41.1
        curl -fsSL \
          -o /tmp/operator-sdk \
          "https://github.com/operator-framework/operator-sdk/releases/download/${version}/operator-sdk_linux_amd64"
        sudo install -m 0755 /tmp/operator-sdk /usr/local/bin/operator-sdk
        operator-sdk version

    - name: Install yq
      run: bash hack/olm/install-yq.sh

    - name: Test catalog channel head selection
      run: bash hack/olm/test-channel-head.sh

    - name: Test release channel selection
      run: bash hack/olm/test-release-channel.sh

    - name: Test public catalog release gates
      run: bash hack/olm/test-release-workflow-gates.sh

    - name: Test chart exposure templates
      run: |
        chmod +x hack/olm/test-chart-exposure.sh
        hack/olm/test-chart-exposure.sh

    - name: Test Kubernetes catalog submission validation
      run: bash hack/olm/test-open-kubernetes-operators-pr.sh

    - name: Test catalog submission helper
      run: bash hack/olm/test-catalog-submit.sh

    - name: Render and validate bundle
      run: |
        for crd_file in krkn.krkn-chaos.dev_krkngraphruns.yaml krkn.krkn-chaos.dev_krknscenarioruns.yaml; do
          if ! cmp -s "config/crd/bases/$crd_file" "charts/krkn-operator/crds/$crd_file"; then
            echo "Chart CRD is out of sync with generated CRD: $crd_file" >&2
            exit 1
          fi
        done
        chmod +x hack/olm/render-bundle.sh
        output_dir="dist/bundle-${{ matrix.profile }}"
        hack/olm/render-bundle.sh "${{ matrix.profile }}" "$VERSION" "$output_dir"
        if find "$output_dir/manifests" -type f -name '*jwt*secret*' -print -quit | grep -q .; then
          echo "JWT Secret manifests must not be included in OLM bundles" >&2
          exit 1
        fi
        csv_file="$output_dir/manifests/krkn-operator.clusterserviceversion.yaml"
        component_crd="$output_dir/manifests/krkn.krkn-chaos.dev_krkncomponents.yaml"
        test -f "$component_crd"
        test "$(yq -r '.spec.customresourcedefinitions.owned[] | select(.name == "krkncomponents.krkn.krkn-chaos.dev") | .displayName' "$csv_file")" = "Krkn Component"
        test "$(yq -r '.metadata.annotations."alm-examples" | from_json | length' "$component_crd")" -gt 0
        workspace_crd="$output_dir/manifests/krkn.krkn-chaos.dev_krknworkspaces.yaml"
        test -f "$workspace_crd"
        test "$(yq -r '.spec.customresourcedefinitions.owned[] | select(.name == "krknworkspaces.krkn.krkn-chaos.dev") | .displayName' "$csv_file")" = "Krkn Workspace"
        test "$(yq -r '.metadata.annotations."alm-examples" | from_json | length' "$workspace_crd")" -gt 0
        graph_run_crd="$output_dir/manifests/krkn.krkn-chaos.dev_krkngraphruns.yaml"
        scenario_run_crd="$output_dir/manifests/krkn.krkn-chaos.dev_krknscenarioruns.yaml"
        test -f "$graph_run_crd"
        test -f "$scenario_run_crd"
        graph_node_type='.spec.versions[] | select(.name == "v1alpha1") | .schema.openAPIV3Schema.properties.spec.properties.graph.additionalProperties.properties.nodeType'
        scenario_node_type='.spec.versions[] | select(.name == "v1alpha1") | .schema.openAPIV3Schema.properties.spec.properties.nodeType'
        test "$(yq -r "$graph_node_type.type" "$graph_run_crd")" = "string"
        test "$(yq -r "$scenario_node_type.type" "$scenario_run_crd")" = "string"
        test "$(yq -r "$graph_node_type.enum | contains([\"trigger\"])" "$graph_run_crd")" = "true"
        test "$(yq -r "$scenario_node_type.enum | contains([\"trigger\"])" "$scenario_run_crd")" = "true"
        test "$(yq -r '.metadata.annotations.capabilities' "$csv_file")" = "Basic Install"
        test "$(yq -r '.metadata.annotations.repository' "$csv_file")" = "https://github.com/krkn-chaos/krkn-operator"
        test "$(yq '.spec.keywords | length' "$csv_file")" -gt 0
        crd_count="$(find "$output_dir/manifests" -type f -name '*.yaml' -exec yq -r 'select(.kind == "CustomResourceDefinition") | .metadata.name' {} \; | grep -c .)"
        test "$(yq '.spec.customresourcedefinitions.owned | length' "$csv_file")" -eq "$crd_count"
        if test "$(yq '[.spec.customresourcedefinitions.owned[] | select((.description // "") == "")] | length' "$csv_file")" -ne 0; then
          echo "All owned CRDs must have a description" >&2
          exit 1
        fi
        if test "$(yq '[.spec.customresourcedefinitions.owned[] | select((.displayName // "") == "")] | length' "$csv_file")" -ne 0; then
          echo "All owned CRDs must have a displayName" >&2
          exit 1
        fi
        while IFS= read -r crd_file; do
          test "$(yq -r '.kind // ""' "$crd_file")" = CustomResourceDefinition || continue
          test -n "$(yq -r '.metadata.annotations."alm-examples" // ""' "$crd_file")" || {
            echo "CRD is missing its alm-examples annotation: $crd_file" >&2
            exit 1
          }
        done < <(find "$output_dir/manifests" -type f -name '*.yaml' -print)
        while IFS= read -r yaml_file; do
          test "$(head -n 1 "$yaml_file")" = "---"
          if awk 'length($0) > 180 { exit 1 }' "$yaml_file"; then
            :
          else
            echo "YAML line exceeds 180 characters: $yaml_file" >&2
            exit 1
          fi
        done < <(find "$output_dir" -type f -name '*.yaml' -print)

    - name: Build bundle image locally
      run: |
        docker build \
          --file "dist/bundle-${{ matrix.profile }}/bundle.Dockerfile" \
          --tag "krkn-operator-bundle:${{ matrix.profile }}-${VERSION}" \
          "dist/bundle-${{ matrix.profile }}"

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: krkn-operator-bundle-${{ matrix.profile }}
        path: dist/bundle-${{ matrix.profile }}
