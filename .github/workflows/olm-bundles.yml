name: OLM Bundles

on:
  pull_request:
    paths:
    - 'charts/krkn-operator/**'
    - 'config/olm/**'
    - 'hack/olm/**'
    - '.github/workflows/olm-bundles.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version to generate
        required: true
        default: 0.1.0

jobs:
  render-and-validate:
    name: Render and validate ${{ matrix.profile }} bundle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [ocp, kubernetes]
    env:
      VERSION: ${{ github.event.inputs.version || '0.1.0' }}
      MIN_KUBE_VERSION: 1.19.0
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Install Operator SDK
      run: |
        version=v1.41.1
        curl -fsSL \
          -o /tmp/operator-sdk \
          "https://github.com/operator-framework/operator-sdk/releases/download/${version}/operator-sdk_linux_amd64"
        sudo install -m 0755 /tmp/operator-sdk /usr/local/bin/operator-sdk
        operator-sdk version

    - name: Install yq
      run: |
        sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
        sudo chmod +x /usr/local/bin/yq

    - name: Test chart exposure templates
      run: |
        chmod +x hack/olm/test-chart-exposure.sh
        hack/olm/test-chart-exposure.sh

    - name: Render and validate bundle
      run: |
        chmod +x hack/olm/render-bundle.sh
        output_dir="dist/bundle-${{ matrix.profile }}"
        hack/olm/render-bundle.sh "${{ matrix.profile }}" "$VERSION" "$output_dir"
        if find "$output_dir/manifests" -type f -name '*jwt*secret*' -print -quit | grep -q .; then
          echo "JWT Secret manifests must not be included in OLM bundles" >&2
          exit 1
        fi
        csv_file="$output_dir/manifests/krkn-operator.clusterserviceversion.yaml"
        test "$(yq -r '.metadata.annotations.capabilities' "$csv_file")" = "Basic Install"
        test "$(yq -r '.metadata.annotations.repository' "$csv_file")" = "https://github.com/krkn-chaos/krkn-operator"
        test "$(yq '.spec.keywords | length' "$csv_file")" -gt 0
        test "$(yq '.spec.customresourcedefinitions.owned | length' "$csv_file")" -eq 9
        if test "$(yq '[.spec.customresourcedefinitions.owned[] | select((.description // "") == "")] | length' "$csv_file")" -ne 0; then
          echo "All owned CRDs must have a description" >&2
          exit 1
        fi
        while IFS= read -r yaml_file; do
          test "$(head -n 1 "$yaml_file")" = "---"
          if awk 'length($0) > 180 { exit 1 }' "$yaml_file"; then
            :
          else
            echo "YAML line exceeds 180 characters: $yaml_file" >&2
            exit 1
          fi
        done < <(find "$output_dir" -type f -name '*.yaml' -print)

    - name: Build bundle image locally
      run: |
        docker build \
          --file "dist/bundle-${{ matrix.profile }}/bundle.Dockerfile" \
          --tag "krkn-operator-bundle:${{ matrix.profile }}-${VERSION}" \
          "dist/bundle-${{ matrix.profile }}"

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: krkn-operator-bundle-${{ matrix.profile }}
        path: dist/bundle-${{ matrix.profile }}
