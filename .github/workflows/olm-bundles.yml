name: OLM Bundles

on:
  pull_request:
    paths:
    - 'charts/krkn-operator/**'
    - 'config/olm/**'
    - 'hack/olm/**'
    - '.github/workflows/olm-bundles.yml'
    - '.github/workflows/release.yml'
    - '.github/workflows/release-chart.yml'
    - '.github/workflows/olm-integration.yml'
  workflow_dispatch:
    inputs:
      version:
        description: Bundle version to generate
        required: true
        default: 0.1.0

jobs:
  render-and-validate:
    name: Render and validate ${{ matrix.profile }} bundle
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [ocp, kubernetes]
    env:
      VERSION: ${{ github.event.inputs.version || '0.1.0' }}
      MIN_KUBE_VERSION: 1.19.0
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Install Operator SDK
      run: |
        version=v1.41.1
        curl -fsSL \
          -o /tmp/operator-sdk \
          "https://github.com/operator-framework/operator-sdk/releases/download/${version}/operator-sdk_linux_amd64"
        sudo install -m 0755 /tmp/operator-sdk /usr/local/bin/operator-sdk
        operator-sdk version

    - name: Install yq
      run: bash hack/olm/install-yq.sh

    - name: Test catalog channel head selection
      run: bash hack/olm/test-channel-head.sh

    - name: Test release channel selection
      run: bash hack/olm/test-release-channel.sh

    - name: Test public catalog release gates
      run: bash hack/olm/test-release-workflow-gates.sh

    - name: Test chart exposure templates
      run: |
        chmod +x hack/olm/test-chart-exposure.sh
        hack/olm/test-chart-exposure.sh

    - name: Test Kubernetes catalog submission validation
      run: bash hack/olm/test-open-kubernetes-operators-pr.sh

    - name: Test catalog submission helper
      run: bash hack/olm/test-catalog-submit.sh

    - name: Render and validate bundle
      run: |
        chmod +x hack/olm/render-bundle.sh
        output_dir="dist/bundle-${{ matrix.profile }}"
        hack/olm/render-bundle.sh "${{ matrix.profile }}" "$VERSION" "$output_dir"
        if find "$output_dir/manifests" -type f -name '*jwt*secret*' -print -quit | grep -q .; then
          echo "JWT Secret manifests must not be included in OLM bundles" >&2
          exit 1
        fi
        csv_file="$output_dir/manifests/krkn-operator.clusterserviceversion.yaml"
        component_crd="$output_dir/manifests/krkn.krkn-chaos.dev_krkncomponents.yaml"
        test -f "$component_crd"
        test "$(yq -r '.spec.customresourcedefinitions.owned[] | select(.name == "krkncomponents.krkn.krkn-chaos.dev") | .displayName' "$csv_file")" = "Krkn Component"
        ai_crd="$output_dir/manifests/krkn.krkn-chaos.dev_krknairuns.yaml"
        test -f "$ai_crd"
        test "$(yq -r '.spec.customresourcedefinitions.owned[] | select(.name == "krknairuns.krkn.krkn-chaos.dev") | .displayName' "$csv_file")" = "Krkn AI Run"
        test "$(yq -r '.metadata.annotations."alm-examples" | from_json | .[] | select(.kind == "KrknAIRun") | .metadata.name' "$ai_crd")" = "example-krkn-ai-run"
        if yq -e 'select(
          (.kind == "Deployment" and .metadata.name == "krkn-operator-ai-service") or
          (.kind == "Service" and .metadata.name == "krkn-operator-ai-service") or
          (.kind == "PersistentVolumeClaim" and .metadata.name == "krkn-operator-ai-service") or
          (.kind == "Secret" and .metadata.name == "krkn-operator-ai-service-token") or
          (.kind == "ServiceAccount" and (.metadata.name == "krkn-operator-ai-service" or .metadata.name == "krkn-operator-krkn-ai-orchestrator")) or
          (.kind == "Role" and .metadata.name == "krkn-operator-krkn-ai-orchestrator") or
          (.kind == "RoleBinding" and .metadata.name == "krkn-operator-krkn-ai-orchestrator") or
          (.kind == "ClusterRoleBinding" and (.metadata.name | test("krkn-operator-ai-orchestrator-anyuid"))) or
          (.kind == "NetworkPolicy" and .metadata.name == "krkn-operator-ai-service"))' \
          "$output_dir"/manifests/*.yaml >/dev/null; then
          echo "Runtime-managed Krkn-AI resources must not be bundled" >&2
          exit 1
        fi
        if yq -e 'select(.kind == "ClusterServiceVersion") |
          .spec.install.spec.deployments[] |
          select(.name == "krkn-operator-ai-service")' "$csv_file" >/dev/null; then
          echo "CSV must not install an AI service Deployment" >&2
          exit 1
        fi
        if yq -e 'select(.kind == "ClusterServiceVersion") |
          .spec.install.spec.deployments[] | .spec.template.spec.containers[] |
          select(.name == "manager") | .args[] | select(test("^--enable-krkn-ai="))' \
          "$csv_file" >/dev/null; then
          echo "OLM manager must take Krkn-AI enablement from startup environment" >&2
          exit 1
        fi
        olm_open_shift=false
        if test "${{ matrix.profile }}" = "ocp"; then olm_open_shift=true; fi
        manager_env_value() {
          local env_name=$1
          ENV_NAME="$env_name" yq -r '.spec.install.spec.deployments[] | select(.name == "krkn-operator-operator") |
            .spec.template.spec.containers[] | select(.name == "manager") | .env[] |
            select(.name == strenv(ENV_NAME)) | .value' "$csv_file"
        }
        test "$(manager_env_value KRKN_OLM_ENABLED)" = true
        test "$(manager_env_value KRKN_OLM_OPENSHIFT)" = "$olm_open_shift"
        test "$(manager_env_value KRKNAI_ENABLED)" = false
        test "$(manager_env_value KRKNAI_ORCHESTRATOR_IMAGE)" = \
          "$(yq -r '.spec.relatedImages[] | select(.name == "krkn-ai-orchestrator") | .image' "$csv_file")"
        test "$(manager_env_value KRKNAI_SERVICE_IMAGE)" = \
          "$(yq -r '.spec.relatedImages[] | select(.name == "krkn-ai-service") | .image' "$csv_file")"
        for env_name in \
          KRKNAI_ORCHESTRATOR_IMAGE_PULL_POLICY \
          KRKNAI_SERVICE_IMAGE_PULL_POLICY \
          KRKNAI_IMAGE_PULL_SECRETS \
          KRKNAI_STORAGE_EXISTING_CLAIM \
          KRKNAI_STORAGE_CLASS_NAME \
          KRKNAI_STORAGE_SIZE \
          KRKNAI_SERVICE_RESOURCES \
          KRKNAI_ORCHESTRATOR_RESOURCES \
          KRKNAI_RESULT_UPLOADER_RESOURCES \
          KRKNAI_OUTPUT_SIZE_LIMIT \
          KRKNAI_TMP_SIZE_LIMIT \
          KRKNAI_UPLOAD_STATE_SIZE_LIMIT \
          KRKNAI_NETWORK_POLICY_ENABLED; do
          ENV_NAME="$env_name" yq -e '.spec.install.spec.deployments[] | select(.name == "krkn-operator-operator") |
            .spec.template.spec.containers[] | select(.name == "manager") | .env[] |
            select(.name == strenv(ENV_NAME))' "$csv_file" >/dev/null || {
              echo "Missing OLM manager environment contract: $env_name" >&2
              exit 1
            }
        done
        yq -e '.spec.install.spec.deployments[] | select(.name == "krkn-operator-operator") |
          .spec.template.spec.containers[] | select(.name == "manager") | .env[] |
          select(.name == "POD_NAMESPACE") | .valueFrom.fieldRef.fieldPath == "metadata.namespace"' \
          "$csv_file" >/dev/null
        permission_rules="$output_dir/operator-permission-rules.txt"
        yq -r '.spec.install.spec.permissions[] | select(.serviceAccountName == "krkn-operator") |
          .rules[] | [(.apiGroups // [] | join(",")), (.resources // [] | join(",")),
          (.resourceNames // [] | join(",")), (.verbs // [] | join(","))] | join("|")' \
          "$csv_file" > "$permission_rules"
        require_permission() {
          local permission_file=$1 group=$2 resource=$3
          shift 3
          local api resources resource_names verbs required_verb found
          while IFS='|' read -r api resources resource_names verbs; do
            if [[ -n "$group" ]]; then
              [[ ",$api," == *",$group,"* ]] || continue
            else
              [[ "$api" == "" ]] || continue
            fi
            [[ ",$resources," == *",$resource,"* ]] || continue
            found=true
            for required_verb in "$@"; do
              [[ ",$verbs," == *",$required_verb,"* ]] || { found=false; break; }
            done
            [[ "$found" == true ]] && return 0
          done < "$permission_file"
          echo "Missing $group/$resource permission with verbs: $*" >&2
          return 1
        }
        require_named_permission() {
          local permission_file=$1 group=$2 resource=$3 resource_name=$4
          shift 4
          local api resources resource_names verbs required_verb found
          while IFS='|' read -r api resources resource_names verbs; do
            [[ ",$api," == *",$group,"* && ",$resources," == *",$resource,"* &&
              ",$resource_names," == *",$resource_name,"* ]] || continue
            found=true
            for required_verb in "$@"; do
              [[ ",$verbs," == *",$required_verb,"* ]] || { found=false; break; }
            done
            [[ "$found" == true ]] && return 0
          done < "$permission_file"
          echo "Missing name-scoped $group/$resource permission for $resource_name with verbs: $*" >&2
          return 1
        }
        require_permission "$permission_rules" apps deployments create get list watch patch update
        require_permission "$permission_rules" "" persistentvolumeclaims create get list watch patch update
        require_permission "$permission_rules" "" services create get list watch patch update
        require_permission "$permission_rules" "" serviceaccounts create get list watch patch update
        require_permission "$permission_rules" networking.k8s.io networkpolicies create get list watch patch update
        require_named_permission "$permission_rules" networking.k8s.io networkpolicies krkn-operator-ai-service delete
        require_permission "$permission_rules" rbac.authorization.k8s.io roles create get update
        require_permission "$permission_rules" rbac.authorization.k8s.io rolebindings create get update
        require_permission "$permission_rules" krkn.krkn-chaos.dev krknairuns create get update delete
        require_permission "$permission_rules" krkn.krkn-chaos.dev krknairuns/status get patch update
        require_permission "$permission_rules" krkn.krkn-chaos.dev krknairuns/finalizers update
        require_named_permission "$permission_rules" rbac.authorization.k8s.io roles krkn-operator-krkn-ai-orchestrator bind escalate
        if test "${{ matrix.profile }}" = "ocp"; then
          cluster_permission_rules="$output_dir/operator-cluster-permission-rules.txt"
          yq -r '.spec.install.spec.clusterPermissions[] | select(.serviceAccountName == "krkn-operator") |
            .rules[] | [(.apiGroups // [] | join(",")), (.resources // [] | join(",")),
            (.resourceNames // [] | join(",")), (.verbs // [] | join(","))] | join("|")' \
            "$csv_file" > "$cluster_permission_rules"
          require_permission "$cluster_permission_rules" rbac.authorization.k8s.io clusterrolebindings update
          require_named_permission "$cluster_permission_rules" rbac.authorization.k8s.io clusterroles system:openshift:scc:anyuid bind
        fi
        if yq -e '.spec.install.spec.deployments[] | .spec.template.spec.containers[] | .env[] |
          select(.name == "KRKNAI_SERVICE_TOKEN" or .name == "KRKNAI_SERVICE_URL")' \
          "$csv_file" >/dev/null; then
          echo "OLM manager must not depend on a runtime token Secret or URL env" >&2
          exit 1
        fi
        test "$(yq -r '.metadata.annotations."alm-examples" | from_json | length' "$component_crd")" -gt 0
        workspace_crd="$output_dir/manifests/krkn.krkn-chaos.dev_krknworkspaces.yaml"
        test -f "$workspace_crd"
        test "$(yq -r '.spec.customresourcedefinitions.owned[] | select(.name == "krknworkspaces.krkn.krkn-chaos.dev") | .displayName' "$csv_file")" = "Krkn Workspace"
        test "$(yq -r '.metadata.annotations."alm-examples" | from_json | length' "$workspace_crd")" -gt 0
        test "$(yq -r '.metadata.annotations.capabilities' "$csv_file")" = "Basic Install"
        test "$(yq -r '.metadata.annotations.repository' "$csv_file")" = "https://github.com/krkn-chaos/krkn-operator"
        test "$(yq '.spec.keywords | length' "$csv_file")" -gt 0
        crd_count="$(find "$output_dir/manifests" -type f -name '*.yaml' -exec yq -r 'select(.kind == "CustomResourceDefinition") | .metadata.name' {} \; | grep -c .)"
        test "$(yq '.spec.customresourcedefinitions.owned | length' "$csv_file")" -eq "$crd_count"
        if test "$(yq '[.spec.customresourcedefinitions.owned[] | select((.description // "") == "")] | length' "$csv_file")" -ne 0; then
          echo "All owned CRDs must have a description" >&2
          exit 1
        fi
        if test "$(yq '[.spec.customresourcedefinitions.owned[] | select((.displayName // "") == "")] | length' "$csv_file")" -ne 0; then
          echo "All owned CRDs must have a displayName" >&2
          exit 1
        fi
        while IFS= read -r crd_file; do
          test "$(yq -r '.kind // ""' "$crd_file")" = CustomResourceDefinition || continue
          test -n "$(yq -r '.metadata.annotations."alm-examples" // ""' "$crd_file")" || {
            echo "CRD is missing its alm-examples annotation: $crd_file" >&2
            exit 1
          }
        done < <(find "$output_dir/manifests" -type f -name '*.yaml' -print)
        while IFS= read -r yaml_file; do
          test "$(head -n 1 "$yaml_file")" = "---"
          if awk 'length($0) > 180 { exit 1 }' "$yaml_file"; then
            :
          else
            echo "YAML line exceeds 180 characters: $yaml_file" >&2
            exit 1
          fi
        done < <(find "$output_dir" -type f -name '*.yaml' -print)

    - name: Build bundle image locally
      run: |
        docker build \
          --file "dist/bundle-${{ matrix.profile }}/bundle.Dockerfile" \
          --tag "krkn-operator-bundle:${{ matrix.profile }}-${VERSION}" \
          "dist/bundle-${{ matrix.profile }}"

    - name: Upload bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: krkn-operator-bundle-${{ matrix.profile }}
        path: dist/bundle-${{ matrix.profile }}
