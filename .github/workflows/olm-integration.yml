name: OLM Integration

on:
  workflow_dispatch:
    inputs:
      bundle_image:
        description: Public bundle image for the initial installation
        required: true
        type: string
      upgrade_bundle_image:
        description: Public bundle image for the upgrade test
        required: true
        type: string

jobs:
  install-and-upgrade:
    name: Install and upgrade bundle on Kind
    runs-on: ubuntu-24.04
    env:
      BUNDLE_IMAGE: ${{ inputs.bundle_image }}
      UPGRADE_BUNDLE_IMAGE: ${{ inputs.upgrade_bundle_image }}
      OLM_NAMESPACE: krkn-operator-system
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Kind
      run: |
        curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
        chmod +x /tmp/kind
        sudo install -m 0755 /tmp/kind /usr/local/bin/kind
        kind version

    - name: Create disposable cluster
      run: kind create cluster --name krkn-olm

    - name: Install Operator SDK
      run: |
        version=v1.41.1
        curl -fsSL \
          -o /tmp/operator-sdk \
          "https://github.com/operator-framework/operator-sdk/releases/download/${version}/operator-sdk_linux_amd64"
        sudo install -m 0755 /tmp/operator-sdk /usr/local/bin/operator-sdk
        operator-sdk version

    - name: Install OLM
      run: operator-sdk olm install

    - name: Install initial bundle
      run: |
        kubectl create namespace "$OLM_NAMESPACE"
        operator-sdk run bundle "$BUNDLE_IMAGE" \
          --namespace "$OLM_NAMESPACE" \
          --install-mode OwnNamespace \
          --timeout 10m

    - name: Verify initial installation
      run: |
        kubectl wait --for=condition=Available \
          deployment \
          -l app.kubernetes.io/component=operator \
          -n "$OLM_NAMESPACE" \
          --timeout=5m
        kubectl get csv -n "$OLM_NAMESPACE"
        kubectl get deployment -n "$OLM_NAMESPACE"

    - name: Upgrade bundle
      run: |
        operator-sdk run bundle-upgrade "$UPGRADE_BUNDLE_IMAGE" \
          --namespace "$OLM_NAMESPACE" \
          --timeout 10m

    - name: Verify upgrade
      run: |
        kubectl wait --for=condition=Available \
          deployment \
          -l app.kubernetes.io/component=operator \
          -n "$OLM_NAMESPACE" \
          --timeout=5m
        kubectl get csv -n "$OLM_NAMESPACE"
        kubectl get deployment -n "$OLM_NAMESPACE"

    - name: Collect cluster diagnostics
      if: always()
      run: |
        kubectl get pods -A -o wide || true
        kubectl get events -A --sort-by=.lastTimestamp || true
        kubectl get csv -A -o yaml || true

    - name: Delete disposable cluster
      if: always()
      run: kind delete cluster --name krkn-olm
